<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Um dialog simples contendo um form -->
    <dialog open class="box hidden">
      <span class="closeCard">X</span>
      <form class="card">
        <section class="inputs">
          <label for="nome"
            >Nome
            <input type="text" id="name" placeholder="Autor" required />
          </label>
          <label for="pagina">
            <input
              type="number"
              name="Pages"
              id="pages"
              placeholder="Paginas"
              min="30"
              required
            />
          </label>
          <label for="description">
            <textarea
              name="description"
              id="description"
              cols="29"
              rows="3"
              placeholder="Lorem Ipsum is simply dummy text of the printing."
            ></textarea>
          </label>
          <label for="caminho">
            <input
              type="text"
              name="caminho"
              id="imgSrc"
              placeholder="Link da imagem"
              required
            />
          </label>
        </section>
        <menu class="menu">
          <button type="reset">Cancel</button>
          <button class="enviar">Enviar</button>
        </menu>
      </form>
    </dialog>

    <button class="add">Add Book</button>

    <section class="estante"></section>
    <script type="module" src="index.js"></script>
  </body>
</html>
